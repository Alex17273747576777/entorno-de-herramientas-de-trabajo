allprojects {
    tasks.withType(Test).configureEach {
        minHeapSize = '128m'
        maxHeapSize = '768m'
    }
    afterEvaluate {
        if (project.name == 'tachi-host' || project == rootProject) {
            java.toolchain.languageVersion = JavaLanguageVersion.of(21)
            tasks.register('liveMangaDex', JavaExec) {
                dependsOn(tasks.named('testClasses'))
                classpath = sourceSets['test'].runtimeClasspath
                mainClass = 'dev.tachi.host.MangaDexLiveSmoke'
                systemProperty 'tachi.zstd.library', '/home/user/work/ci/libtachi-native/libpocketmanga-zstd.so'
                args System.getenv('CEROX_MANGADEX_APK')
            }
        }
    }
}
